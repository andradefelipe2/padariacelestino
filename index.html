<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padaria Celestino | Limão, São Paulo</title>
<meta name="description" content="Padaria Celestino no Limão, São Paulo. Aberta das 6h às 23h. Encomendas de salgados, docinhos, bolos e kits festas com delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Satisfy&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEDC;--surface:#FBF8EE;--ink:#3A2A1E;--muted:#6B5A4C;--brand:#A0612A;--onbrand:#fff;--blue:#5F7290;--line:#D9CBA8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1411;--surface:#241C17;--ink:#F1E8D6;--muted:#B8A894;--brand:#D18A4E;--onbrand:#1A1411;--blue:#A3B3CB;--line:#3C2F26}}
:root[data-theme="dark"]{--bg:#1A1411;--surface:#241C17;--ink:#F1E8D6;--muted:#B8A894;--brand:#D18A4E;--onbrand:#1A1411;--blue:#A3B3CB;--line:#3C2F26}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
a{color:inherit}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blue);font:400 1.7rem/1 Satisfy,cursive}
.brand svg{width:34px;height:34px;color:var(--brand)}
nav{margin-left:auto;display:flex;gap:22px}
nav a{text-decoration:none;font-weight:600;font-size:.95rem;color:var(--muted)}
nav a:hover{color:var(--brand)}
.tg{padding:0 18px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:600 .95rem "Nunito Sans",sans-serif}
@media (max-width:700px){nav{display:none}.tg{margin-left:auto}}
.hero{padding:64px 0 48px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);font-weight:700;letter-spacing:-.01em}
.hero h1 span{display:block;font:400 clamp(3rem,9vw,5.5rem)/1.05 Satisfy,cursive;color:var(--blue);margin-bottom:6px}
.hero p{max-width:34em;color:var(--muted);margin:20px 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--brand);background:var(--brand);color:var(--onbrand);cursor:pointer;font-size:1rem;font-family:inherit}
.btn.o{background:transparent;color:var(--brand)}
.btn:hover{filter:brightness(1.08)}
.emblem{aspect-ratio:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;max-width:340px;justify-self:center;width:100%;position:relative}
.emblem::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--line)}
.emblem svg{width:52%;height:52%;color:var(--brand)}
.emblem b{position:absolute;bottom:20%;font:400 2rem/1 Satisfy,cursive;color:var(--blue)}
@media (max-width:760px){.hero{padding-top:40px}.hero .wrap{grid-template-columns:1fr}.emblem{max-width:220px;order:-1;justify-self:start}}
.facts{border-block:1px solid var(--line);background:var(--surface)}
.facts ul{list-style:none;margin:0;padding:18px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.facts li{display:flex;gap:12px;align-items:center;font-weight:600}
.facts .i{color:var(--brand);width:1.6em;height:1.6em}
.facts small{display:block;font-weight:400;color:var(--muted)}
section{padding:72px 0}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px}
.lead{color:var(--muted);max-width:38em;margin:0 0 32px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tabs button{font:600 .95rem inherit;font-family:inherit;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.panel[hidden]{display:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.card h3{font-size:1.35rem;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.pl li::after{content:"";order:1;flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.pl .n{order:0}
.pl .p{order:2;font-weight:700;color:var(--brand);white-space:nowrap}
.kit{display:flex;flex-direction:column}
.kit .pp{font:700 3rem/1 Fraunces,serif;color:var(--blue)}
.kit .pp small{font:400 1.6rem Satisfy,cursive;margin-left:6px}
.kit .pr{font-weight:700;color:var(--brand);font-size:1.3rem;margin:4px 0 12px}
.kit ul{margin:0 0 18px;padding:0;list-style:none;flex:1}
.kit li{padding:5px 0;border-top:1px solid var(--line);font-size:.97rem}
.kit .btn{justify-content:center;padding:11px 18px}
.note{margin-top:22px;color:var(--muted);font-size:.92rem}
.enc{background:var(--surface);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:14px}
.steps .i{width:2.2em;height:2.2em;color:var(--brand);padding:8px;border:1.5px solid var(--line);border-radius:50%;box-sizing:content-box;width:1.6em;height:1.6em}
.steps h3{font-size:1.1rem;margin-bottom:4px}
.steps p{margin:0;color:var(--muted);font-size:.97rem}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.rows{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:16px}
.rows li{display:flex;gap:14px;align-items:flex-start}
.rows .i{color:var(--brand);margin-top:3px}
.rows a{text-decoration:none;font-weight:700}
.rows a:hover{color:var(--brand)}
.rows small{display:block;color:var(--muted)}
.mapbox{border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.mapbox .i{width:2.4em;height:2.4em;color:var(--brand)}
.mk{height:54px;width:auto;border-radius:10px;background:#fff;border:1px solid var(--line)}
.emblem{background:#fff}.emblem img{width:80%;height:auto;border-radius:50%}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;min-height:240px;background:var(--bg)}.map iframe{width:100%;height:100%;border:0}
.pl li.mv{flex-wrap:wrap}.pl li.mv::after{display:none}.ch{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{font:600 .85rem "Nunito Sans",sans-serif;padding:6px 12px;border-radius:999px;border:1.5px solid var(--brand);background:transparent;color:var(--ink);cursor:pointer}.chip b{color:var(--brand)}.chip:hover{background:var(--brand);color:var(--onbrand)}.chip:hover b{color:var(--onbrand)}
.gh{font-size:1.4rem;margin:8px 0 16px}.cols+.gh{margin-top:36px}#mn{margin-bottom:12px}#mn button{font-size:1rem}
footer{border-top:1px solid var(--line);padding:28px 0 110px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
.wa{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:30;transition:transform .2s}
.wa:hover{transform:scale(1.07)}
.wa svg{width:36px;height:36px;fill:#fff}
.pl li{align-items:center;padding:3px 0}.pl li::after{transform:translateY(7px)}
.pl .add{order:3;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer;flex:none;margin-left:4px}
.pl .add:hover{background:var(--brand);color:var(--onbrand)}
.cf{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(94px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--onbrand);border:0;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:30;cursor:pointer}
.cf .i{width:26px;height:26px}
.cf span{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--ink);color:var(--bg);font:700 .8rem/22px "Nunito Sans",sans-serif;text-align:center}
.cf.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.15)}}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.dr[hidden],.sc[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dr ul{list-style:none;margin:0;padding:0;flex:1;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .t{flex:1;font-weight:600;line-height:1.3}.ci small{display:block;font-weight:400;color:var(--muted)}
.q{display:flex;align-items:center;gap:8px}
.q button,.dx{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.dx{width:auto;padding:0 14px;border-radius:999px;font:600 .9rem "Nunito Sans",sans-serif}
#ce{color:var(--muted);flex:1}
#cs{justify-content:center;margin-top:14px}
#cs[aria-disabled="true"]{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cf.pop{animation:none}html{scroll-behavior:auto}.wa{transition:none}}
</style>
